name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # PINNED, not ubuntu-latest. Noble ships openscad 2021.01, which is exactly
    # the version floor this library is verified against. When ubuntu-latest
    # rolls forward it will carry a different OpenSCAD and CI would silently
    # stop testing the floor.
    runs-on: ubuntu-24.04
    env:
      # STL export needs no X server -- verified. PNG PREVIEW DOES: `just preview`
      # renders through OpenCSG, which needs a real GL context, and OpenSCAD
      # segfaults under offscreen. That recipe borrows xvfb itself; everything
      # else stays headless under this.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad just

      # topiary formats the .scad sources, and its version decides its output, so it
      # is pinned by digest. Bump it with workstation-configs' apps/topiary.
      - name: Install topiary
        run: |
          name=topiary-cli-x86_64-unknown-linux-gnu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/tweag/topiary/releases/download/v0.8.0/$name.tar.xz"
          echo "42e54ff151dd6b20621166a09e3a5df2b367a108799900c3adbfc9c10dc93aa1  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/$name/topiary" /usr/local/bin/topiary
          topiary prefetch openscad

      - name: Verify the toolchain
        run: just setup

      - name: Assert the version floor is exactly what the library was verified on
        # `just setup` PRINTS the version but does not fail on a mismatch.
        # Without this, an apt bump would move CI off the floor silently -- the
        # same instinct as --hardwarnings: make the silent case loud.
        run: openscad --version 2>&1 | grep -q '2021.01'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Preview needs a GL implementation
        # `just preview` renders through OpenCSG, not CGAL, so it needs GL even
        # headless. Install it explicitly rather than letting the recipe decide
        # it cannot run -- a preview gate that skips reads exactly like a pass,
        # and the defect it exists to catch was invisible to every other gate.
        run: sudo apt-get install -y --no-install-recommends libgl1-mesa-dri xvfb mesa-utils

      - name: partspec must actually run, not skip
        # `just partspec` exits 0 when uvx is absent, which is friendly locally
        # and dangerous here: a green build with 19 unrun contract checks.
        run: command -v uvx

      - run: just check
      - run: just test
      - run: just cgal
      - run: just partspec

      - name: Keep the evidence when the gate fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: out
          path: out/
          retention-days: 7
